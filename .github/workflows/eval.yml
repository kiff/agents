      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: env.AGENTS_MODEL_SOURCE == 'bedrock' && always() && steps.unchanged.outputs.skip != 'true' && steps.preflight.outputs.refused != 'true'
        with:
          role-to-assume: ${{ secrets.AWS_EVAL_ROLE }}
          aws-region: eu-west-1
      - name: Route, the watch's requests over ten tafs
        # A request spoken on the watch reaches Coach by its own way in
        # (cmd/e2e -route, route.go): a session that loads only the watch
        # skill and is limited to reading the tafs and handing one a task.
        # Over ten synthetic tafs, each request goes to the one taf whose job
        # it is, once; none is guessed when none or several could; no watch
        # session reaches a phone skill; and a phone chat never reaches the
        # watch skill. Its taf_task only records: nothing reaches KIFF,
        # planque or the account, so it needs the model's key alone.
        if: steps.unchanged.outputs.skip != 'true' && steps.preflight.outputs.refused != 'true' && (always()) && (contains(steps.suites.outputs.list, ',all,') || contains(steps.suites.outputs.list, ',route,'))
        timeout-minutes: 10
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # Until kiff/tafs at eval/tafs.ref has the watch skill, the suite isn't measured, as hand-offs and tickets aren't.
          if ! jq -e '[.. | objects | select(.name? == "ask-a-taf")] | length > 0' defs/setup.json >/dev/null 2>&1; then
            echo "Route: **not measured**. kiff/tafs at eval/tafs.ref has no ask-a-taf." >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::Route: not measured: kiff/tafs at eval/tafs.ref has no ask-a-taf"
            exit 0
          fi
          go run ./cmd/e2e $([ -d defs/skills ] && echo -skills defs/skills) -setup defs/setup.json -route -grade -repeat "${{ inputs.repeat || '3' }}" -transcript route.md -judge-model claude-sonnet-5-5 -judge-price 2000000,10000000
      - name: The sweep, the test account's leftover tafs
        # The teardown, after every run above whatever they did (sweep.go):
        # archive the tafs this job's runs made (E2E_MADE), so a run cut off
        # before its cleanup leaves none. Archiving takes a taf's keys with
        # it. It works as the owner's phone, with the calls KIFF takes from a
        # phone's session only, and never takes Setup's agent or any agent
        # this job didn't make. It prints only counts, and it never decides
        # the run: a failed sweep is reported, and the verdict is the steps
        # above.
        if: steps.unchanged.outputs.skip != 'true' && steps.preflight.outputs.refused != 'true' && (always())
        continue-on-error: true
        env:
          E2E_KIFF_SESSION: ${{ secrets.E2E_KIFF_SESSION }}
          E2E_PHONE_KEY: ${{ secrets.E2E_PHONE_KEY }}
        run: go run ./cmd/e2e -sweep
      # Each run's seed closes only the last 48 hours' leftover disputes (seed.Recent), since reading every dispute
      # the test account ever had took ~200s a case. This closes any older one a cut-off run left open, once per
      # Eval run. It prints only a count and never decides the run.
      - name: The sweep, the test account's open disputes
        if: steps.unchanged.outputs.skip != 'true' && steps.preflight.outputs.refused != 'true' && (always())
        continue-on-error: true
        env:
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
          EVAL_STRIPE_ACCOUNT: ${{ vars.EVAL_STRIPE_ACCOUNT }}
        run: go run ./cmd/eval seed -close-all chargebacks
      - name: What's deployed, at the end
        # The same read as at the start. A deploy that finished between the
        # two, one still under way, or a side that couldn't be read makes the
        # run mixed: it may have measured more than one version. The block
        # goes into the report (deployed.md) and the run's summary.
        id: deployed
        if: steps.unchanged.outputs.skip != 'true' && steps.preflight.outputs.refused != 'true' && (always())
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          infra/eval-deployed.sh > deployed-end.txt || echo "the end's read failed: the run counts as mixed"
          if infra/eval-deployed.sh compare deployed-start.txt deployed-end.txt > deployed.md; then mixed=false; else mixed=true; fi
          cat deployed.md
          cat deployed.md >> "$GITHUB_STEP_SUMMARY"
          echo "mixed=$mixed" >> "$GITHUB_OUTPUT"
      # Main's role writes under reports/; a branch's (an eval/tafs-<sha>
      # measure, a PR's branch) only under reports/branches/<branch>/, so a
      # check that fails there can be read too (infra/aws.sh). Only a pushed
      # branch's run assumes either: never a pull request's. A red run means a
      # check failed, not the upload.
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: steps.unchanged.outputs.skip != 'true' && steps.preflight.outputs.refused != 'true' && (always() && startsWith(github.ref, 'refs/heads/'))
        with:
          role-to-assume: ${{ github.ref == 'refs/heads/main' && secrets.AWS_EVAL_ROLE || secrets.AWS_EVAL_BRANCH_ROLE }}
          aws-region: eu-west-1
      - name: The full report, to the private bucket
        if: steps.unchanged.outputs.skip != 'true' && steps.preflight.outputs.refused != 'true' && (always() && startsWith(github.ref, 'refs/heads/'))
        run: |
          run="$(date -u +%Y-%m-%d)-${GITHUB_RUN_ID}${LABEL:+-$LABEL}"
          key="reports/$run"
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            key="reports/branches/${GITHUB_REF_NAME}/$run"
          fi
          # -repeat writes each setup's runs after the first as setup-2.md, setup-3.md, …
          for f in report.md report-handoff.md report-doors.md report-tickets.md setup*.md desk*.md invoices*.md replay-intros*.md plan-*.md route*.md; do
            if [ -f "$f" ] && [ -n "$LABEL" ]; then
              { echo "Run: $LABEL (Coach and the tafs on ${MODEL:-their own model}, effort ${EFFORT:-their own})"; echo; cat "$f"; } > "$f.labelled" && mv "$f.labelled" "$f"
            fi
          done
          for f in report.md results.json report-handoff.md results-handoff.json report-doors.md results-doors.json report-tickets.md results-tickets.json setup*.md desk*.md invoices*.md replay-intros*.md plan-*.md route*.md deployed.md; do
            [ -f "$f" ] && aws s3 cp --only-show-errors "$f" "s3://$REPORTS/$key/$f"
          done
          echo "report: s3://$REPORTS/$key/"
      - name: An override doesn't count for the Upgrade gate
        # kiff/tafs' Upgrade gate and the nightly's skip both take the latest
        # completed run on main, when it succeeded, as a pass of the shipped
        # definitions. A run on another model or effort isn't one, so it ends
        # red, whatever its checks said: read its report for those.
        if: always() && (inputs.model != '' || inputs.effort != '')
        run: |
          echo "::error::Override $LABEL: Coach and the tafs ran on ${MODEL:-their own model}, effort ${EFFORT:-their own}. Its checks are in the report; this run doesn't count for the Upgrade gate."
          exit 1
      - name: A run with a deploy in the middle counts only once judged
        # kiff/tafs' Upgrade gate takes a run as measuring one version of
        # tafs cloud, planque and agents. A mixed run ("What's deployed, at the end") ends
        # red, whatever its checks said, and the gate's rule-B check takes it
        # only when it's told this run was judged: whether the deploy could
        # touch the suites it measured (its mixed_judged input, naming this
        # run).
        if: always() && steps.deployed.outputs.mixed == 'true'
        run: |
          echo "::error::Mixed: a deploy landed during this run, or a side couldn't be read (\"What's deployed, at the end\"). It counts for the Upgrade gate only once judged."
          exit 1
      - name: A run of some suites counts only on earlier passes
        # The Upgrade gate and the nightly's skip take the latest completed
        # run on main, when it succeeded, as a full pass of the shipped
        # definitions. A run of some suites is one only when every other
        # suite passed in the newest earlier run on main that measured it,
        # and nothing since touched it (infra/eval-carry.sh, eval/suites.json):
        # then a red suite is rerun alone, and the rest of the verdict stands.
        # Otherwise it ends red, whatever its own checks said, and names each
        # suite with no pass to carry. A run below the bar's repeat never
        # counts.
        if: always() && steps.suites.outputs.list != '' && steps.suites.outputs.list != ',all,'
        env:
          GH_TOKEN: ${{ github.token }}
          LIST: ${{ steps.suites.outputs.list }}
          REPEAT: ${{ inputs.repeat || '3' }}
        run: |
          if [ "$REPEAT" != 3 ]; then
            echo "::error::Suites ${LIST:1:-1} at repeat $REPEAT: below the bar's 3, so this run doesn't count for the Upgrade gate."
            exit 1
          fi
          if ! infra/eval-carry.sh "$LIST"; then
            echo "::error::Suites ${LIST:1:-1} only, and the others have no pass to carry (above): this run doesn't count for the Upgrade gate."
            exit 1
          fi
