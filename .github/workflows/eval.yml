name: Eval
# A run with a model or effort override says so in its name, so it reads apart
# from the shipped definitions' runs in the list.
run-name: ${{ (inputs.model != '' || inputs.effort != '') && format('Eval, override {0}', inputs.label != '' && inputs.label || format('{0} {1}', inputs.model, inputs.effort)) || 'Eval' }}
# The eval loop (#78): each night, the Chargebacks case runs on this commit's
# runtime as kiff/tafs defines its job (eval/tafs.ref), twice on a
# fresh Stripe test-mode seed each, is graded, and fails on a mean below
# eval/baseline.json, or on any gate check that fails in either run (-gate).
# The agent's KIFF key, the model and Stripe's test mode are real.
#
# The gate tests results, and the sentences that could mislead about them:
# what was done, what the record says, what the grant pins. Words and tone
# are advice, reported and never failing the run (the owner, 6 Nov 2026).
#
# This log is public, and so are a public repository's artifacts. So the eval
# prints only each run's score, cost and failed checks' names (-public), and
# the full report (each check's why, the runs' ids) goes to a private bucket,
# written by a role that may only put reports there (infra/aws.sh). The log
# names only the report's key.
#
# Every night and by hand. It doesn't gate pull requests: it spends money
# and depends on live services.
on:
  schedule:
    - cron: "7 4 * * *"
  workflow_dispatch:
    inputs:
      repeat:
        description: "How many times chargebacks runs (the nightly runs it twice)"
        type: string
        default: "2"
      # Comparing models or efforts: Coach and every taf run on this model and
      # effort instead of kiff/tafs' (infra/eval-override.sh), priced as that
      # model charges. Such a run never counts for the Upgrade gate or the
      # nightly's skip: it isn't the shipped definitions, and it ends red.
      model:
        description: "Run Coach and the tafs on this model (empty: as kiff/tafs defines them)"
        type: choice
        options: ["", "claude-opus-5-5", "claude-sonnet-5-5"]
        default: ""
      effort:
        description: "At this effort (empty: as kiff/tafs defines them)"
        type: choice
        options: ["", "low", "medium", "high"]
        default: ""
      label:
        description: "The run's label in its report and report path, e.g. opus-low (a-z, 0-9, -)"
        type: string
        default: ""
permissions:
  contents: read
  id-token: write
  actions: read
# One group with the E2E: both run on the test's account with the same setup agent,
# and a run starts by disconnecting the grants that agent asked for, so two at
# once take each other's tools away. They queue instead.
# GitHub keeps one pending run per group: a scheduled E2E queued behind a
# running Eval replaces a dispatched Eval waiting there, so whoever dispatches
# an Eval checks the queue afterwards.
concurrency:
  group: test-account
  cancel-in-progress: false
jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      REPORTS: kiff-agents-eval-reports
      MODEL: ${{ inputs.model }}
      EFFORT: ${{ inputs.effort }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unchanged since the last pass?
        # A scheduled night measures nothing new when the latest completed
        # run of this workflow on main passed and nothing but docs changed
        # since its commit (eval/tafs.ref included): it says so and spends
        # nothing. Its success carries that pass, with the same
        # eval/tafs.ref, so kiff/tafs' Upgrade gate accepts it. A latest run
        # that failed, or was cancelled, is never skipped over: the night
        # runs, so a red stays red. A dispatch always runs.
        id: unchanged
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/eval.yml/runs?branch=main&status=completed&per_page=5" \
            --jq "[.workflow_runs[] | select(.id != ${GITHUB_RUN_ID})][0] | \"\\(.id) \\(.conclusion) \\(.head_sha)\"")
          read -r id conclusion sha <<<"$last"
          if [ "$conclusion" != success ] || [ -z "$sha" ] || ! git cat-file -e "$sha" 2>/dev/null; then
            exit 0
          fi
          changed=$(git diff --name-only "$sha" HEAD | grep -v -E '^docs/|\.md$' || true)
          if [ -z "$changed" ]; then
            echo "skipped: unchanged since run $id (${sha:0:12})"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-go@v5
        if: steps.unchanged.outputs.skip != 'true'
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        if: steps.unchanged.outputs.skip != 'true'
        with:
          node-version: 22
      - name: tafs' definitions, at eval/tafs.ref
        if: steps.unchanged.outputs.skip != 'true'
        run: |
          git clone --quiet https://github.com/kiff/tafs tafs
          git -C tafs checkout --quiet "$(cat eval/tafs.ref)"
          infra/eval-definitions.sh tafs defs
      - name: The model and effort to compare
        if: steps.unchanged.outputs.skip != 'true' && (inputs.model != '' || inputs.effort != '')
        env:
          ASKED_LABEL: ${{ inputs.label }}
        run: |
          label=${ASKED_LABEL:-$(echo "${MODEL#claude-}-${EFFORT}" | sed 's/-5-5//; s/^-//; s/-$//')}
          if ! printf '%s' "$label" | grep -Eq '^[a-z0-9][a-z0-9-]{0,39}$'; then
            echo "::error::label is 1 to 40 of a-z, 0-9 and -, not \"$label\""; exit 1
          fi
          echo "LABEL=$label" >> "$GITHUB_ENV"
          infra/eval-override.sh defs "$MODEL" "$EFFORT"
          echo "Override **$label**: Coach and the tafs on ${MODEL:-their own model}, effort ${EFFORT:-their own}. It doesn't count for the Upgrade gate." >> "$GITHUB_STEP_SUMMARY"
      - name: Chargebacks, two seeded runs
        if: steps.unchanged.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KIFF_AGENT_KEY: ${{ secrets.KIFF_AGENT_KEY }}
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
          # The evals' own Stripe test account (infra/eval-stripe-account.sh): the seed
          # refuses any other.
          EVAL_STRIPE_ACCOUNT: ${{ vars.EVAL_STRIPE_ACCOUNT }}
        run: |
          go run ./cmd/eval -run -public -definitions defs $([ -d defs/skills ] && echo -skills defs/skills) -seed -repeat "${{ inputs.repeat || '2' }}" \
            -baseline eval/baseline.json -gate \
            -judge-model claude-sonnet-5-5 -judge-price 2000000,10000000 \
            -out results.json -report report.md chargebacks
      - name: Setup with the taf, in English, graded
        # The setup agent as kiff/tafs defines it (setup.json), against prod
        # KIFF, planque and the fake vendor, with the test phone's signed
        # approvals (cmd/e2e). The owner writes in English. The gate is the
        # results: what the grant pins (the mode the owner chose, and only
        # one the connection reports), its plan kept, no planque named, no
        # mode stated as the account's that the connection didn't report,
        # and the taf's answers in the chat, each judged against its record:
        # nothing said done, or not done, that the record contradicts. The
        # taf is kiff/tafs' Refunds (refunds.json). The words (concise, one
        # short line, choices to tap, no id asked, each limit asked once, the
        # wording after a hold) are advice. The chat's transcript (setup.md)
        # goes only to the private bucket, so a failed chat can be read
        # afterwards. Then the improve case (kiff/tafs#107): Setup makes the
        # taf's next version, a trial decides it, the owner switches, it
        # runs. Coach runs at the standard output, as kiff/tafs defines it;
        # the judge is Sonnet, as for chargebacks, and its judged checks take
        # a majority of three.
        if: steps.unchanged.outputs.skip != 'true' && (always())
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          E2E_KIFF_SESSION: ${{ secrets.E2E_KIFF_SESSION }}
          E2E_SETUP_KEY: ${{ secrets.E2E_SETUP_KEY }}
          E2E_PHONE_KEY: ${{ secrets.E2E_PHONE_KEY }}
          E2E_VENDOR: ${{ secrets.E2E_VENDOR }}
          E2E_VENDOR_TOKEN: ${{ secrets.E2E_VENDOR_TOKEN }}
        run: go run ./cmd/e2e $([ -d defs/skills ] && echo -skills defs/skills) -setup defs/setup.json -taf defs/refunds.json -owner en -grade -improve -max-cost 4 -owner-turns 14 -transcript setup.md -judge-model claude-sonnet-5-5 -judge-price 2000000,10000000
      - name: Setup in Spanish, graded, as advice
        # The same chat with an owner who writes in Spanish, nightly only,
        # without the improve case. It never fails the night: what it finds
        # is advice, read in its transcript (setup-es.md, the private bucket).
        if: steps.unchanged.outputs.skip != 'true' && github.event_name == 'schedule' && (always())
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          E2E_KIFF_SESSION: ${{ secrets.E2E_KIFF_SESSION }}
          E2E_SETUP_KEY: ${{ secrets.E2E_SETUP_KEY }}
          E2E_PHONE_KEY: ${{ secrets.E2E_PHONE_KEY }}
          E2E_VENDOR: ${{ secrets.E2E_VENDOR }}
          E2E_VENDOR_TOKEN: ${{ secrets.E2E_VENDOR_TOKEN }}
        run: go run ./cmd/e2e $([ -d defs/skills ] && echo -skills defs/skills) -setup defs/setup.json -taf defs/refunds.json -owner es -grade -max-cost 4 -owner-turns 14 -transcript setup-es.md -judge-model claude-sonnet-5-5 -judge-price 2000000,10000000
      - name: Setup on the second vendor, a desk by its key
        # The same Setup on a vendor that isn't payments and has no MCP server
        # (kiff/agents#293): the fake vendor's support desk, by its REST API and
        # a key the test phone gives as it approves. Graded like the first, and
        # checked once the desk's tools are connected: an API-key grant, every
        # tool pinned to the workspace, writes that name what they act on and
        # carry no amount, reads marked read-only. A Setup rule passes on both
        # vendors or fails the night.
        if: steps.unchanged.outputs.skip != 'true' && (always())
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          E2E_KIFF_SESSION: ${{ secrets.E2E_KIFF_SESSION }}
          E2E_SETUP_KEY: ${{ secrets.E2E_SETUP_KEY }}
          E2E_PHONE_KEY: ${{ secrets.E2E_PHONE_KEY }}
          E2E_VENDOR: ${{ secrets.E2E_VENDOR }}
          E2E_VENDOR_TOKEN: ${{ secrets.E2E_VENDOR_TOKEN }}
          E2E_DESK_KEY: ${{ secrets.E2E_DESK_KEY }}
        run: go run ./cmd/e2e $([ -d defs/skills ] && echo -skills defs/skills) -setup defs/setup.json -desk -grade -max-cost 3 -owner-turns 14 -transcript desk.md -judge-model claude-sonnet-5-5 -judge-price 2000000,10000000
      # Main's role writes under reports/; a branch's (an eval/tafs-<sha>
      # measure, a PR's branch) only under reports/branches/<branch>/, so a
      # check that fails there can be read too (infra/aws.sh). Only a pushed
      # branch's run assumes either: never a pull request's. A red run means a
      # check failed, not the upload.
      - uses: aws-actions/configure-aws-credentials@v4
        if: steps.unchanged.outputs.skip != 'true' && (always() && startsWith(github.ref, 'refs/heads/'))
        with:
          role-to-assume: ${{ github.ref == 'refs/heads/main' && secrets.AWS_EVAL_ROLE || secrets.AWS_EVAL_BRANCH_ROLE }}
          aws-region: eu-west-1
      - name: The full report, to the private bucket
        if: steps.unchanged.outputs.skip != 'true' && (always() && startsWith(github.ref, 'refs/heads/'))
        run: |
          run="$(date -u +%Y-%m-%d)-${GITHUB_RUN_ID}${LABEL:+-$LABEL}"
          key="reports/$run"
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            key="reports/branches/${GITHUB_REF_NAME}/$run"
          fi
          for f in report.md setup.md setup-es.md desk.md; do
            if [ -f "$f" ] && [ -n "$LABEL" ]; then
              { echo "Run: $LABEL (Coach and the tafs on ${MODEL:-their own model}, effort ${EFFORT:-their own})"; echo; cat "$f"; } > "$f.labelled" && mv "$f.labelled" "$f"
            fi
          done
          for f in report.md results.json setup.md setup-es.md desk.md; do
            [ -f "$f" ] && aws s3 cp --only-show-errors "$f" "s3://$REPORTS/$key/$f"
          done
          echo "report: s3://$REPORTS/$key/"
      - name: An override doesn't count for the Upgrade gate
        # kiff/tafs' Upgrade gate and the nightly's skip both take the latest
        # completed run on main, when it succeeded, as a pass of the shipped
        # definitions. A run on another model or effort isn't one, so it ends
        # red, whatever its checks said: read its report for those.
        if: always() && (inputs.model != '' || inputs.effort != '')
        run: |
          echo "::error::Override $LABEL: Coach and the tafs ran on ${MODEL:-their own model}, effort ${EFFORT:-their own}. Its checks are in the report; this run doesn't count for the Upgrade gate."
          exit 1
