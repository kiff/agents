name: Eval
# The eval loop (#78): each night, the Chargebacks case runs on this commit's
# runtime as kiff/tafs defines its job (eval/tafs.ref), three times on a
# fresh Stripe test-mode seed each, is graded, and fails on a mean below
# eval/baseline.json. The agent's KIFF key, the model and Stripe's test mode
# are real.
#
# This log is public, and so are a public repository's artifacts. So the eval
# prints only each run's score, cost and failed checks' names (-public), and
# the full report (each check's why, the runs' ids) goes to a private bucket,
# written by a role that may only put reports there (infra/aws.sh). The log
# names only the report's key.
#
# Every night and by hand. It doesn't gate pull requests: it spends money
# and depends on live services.
on:
  schedule:
    - cron: "7 4 * * *"
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: eval
  cancel-in-progress: false
jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      REPORTS: kiff-agents-eval-reports
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: tafs' definitions, at eval/tafs.ref
        run: |
          git clone --quiet https://github.com/kiff/tafs tafs
          git -C tafs checkout --quiet "$(cat eval/tafs.ref)"
          infra/eval-definitions.sh tafs defs
      - name: Chargebacks, three seeded runs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KIFF_AGENT_KEY: ${{ secrets.KIFF_AGENT_KEY }}
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
          # The evals' own Stripe test account (infra/eval-stripe-account.sh): the seed
          # refuses any other.
          EVAL_STRIPE_ACCOUNT: ${{ vars.EVAL_STRIPE_ACCOUNT }}
        run: |
          go run ./cmd/eval -run -public -definitions defs $([ -d defs/skills ] && echo -skills defs/skills) -seed -repeat 3 \
            -baseline eval/baseline.json \
            -judge-model claude-opus-5-5 -judge-price 4000000,20000000 \
            -out results.json -report report.md chargebacks
      - name: Setup, in Spanish, graded
        # The setup agent as kiff/tafs defines it (setup.json), against prod
        # KIFF, planque and the fake vendor, with the test phone's signed
        # approvals (cmd/e2e). The owner writes in Spanish; the chat is
        # graded: the owner's language, concise messages, no id asked, the agent
        # named from the taf's name, choices to tap. The taf the owner then uses
        # is kiff/tafs' Refunds (refunds.json), whose answers in the chat must be
        # concise. The chat's transcript (setup.md) goes only to the private
        # bucket, so a failed chat can be read afterwards. Then the improve
        # case (kiff/tafs#107): Setup makes the taf's next version, a trial
        # decides it, the owner switches, it runs. A failed check fails the
        # night. Setup runs at the fast output (#197): its cap keeps the same
        # room.
        if: always()
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          E2E_KIFF_SESSION: ${{ secrets.E2E_KIFF_SESSION }}
          E2E_SETUP_KEY: ${{ secrets.E2E_SETUP_KEY }}
          E2E_PHONE_KEY: ${{ secrets.E2E_PHONE_KEY }}
          E2E_VENDOR: ${{ secrets.E2E_VENDOR }}
          E2E_VENDOR_TOKEN: ${{ secrets.E2E_VENDOR_TOKEN }}
        run: go run ./cmd/e2e $([ -d defs/skills ] && echo -skills defs/skills) -setup defs/setup.json -taf defs/refunds.json -owner es -grade -improve -max-cost 10 -owner-turns 14 -transcript setup.md
      # Main's role writes under reports/; a branch's (an eval/tafs-<sha>
      # measure, a PR's branch) only under reports/branches/<branch>/, so a
      # check that fails there can be read too (infra/aws.sh). Only a pushed
      # branch's run assumes either: never a pull request's. A red run means a
      # check failed, not the upload.
      - uses: aws-actions/configure-aws-credentials@v4
        if: always() && startsWith(github.ref, 'refs/heads/')
        with:
          role-to-assume: ${{ github.ref == 'refs/heads/main' && secrets.AWS_EVAL_ROLE || secrets.AWS_EVAL_BRANCH_ROLE }}
          aws-region: eu-west-1
      - name: The full report, to the private bucket
        if: always() && startsWith(github.ref, 'refs/heads/')
        run: |
          key="reports/$(date -u +%Y-%m-%d)-${GITHUB_RUN_ID}"
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            key="reports/branches/${GITHUB_REF_NAME}/$(date -u +%Y-%m-%d)-${GITHUB_RUN_ID}"
          fi
          for f in report.md results.json setup.md; do
            [ -f "$f" ] && aws s3 cp --only-show-errors "$f" "s3://$REPORTS/$key/$f"
          done
          echo "report: s3://$REPORTS/$key/"
