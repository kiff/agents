name: E2E recipe
# A recipe's taf, built by Coach from the recipe's words alone (cmd/e2e
# -desk -recipe): the simulated owner says a kiff/tafs recipe's words, unchanged,
# then only where the fake vendor's desk is, and the run goes on to the taf, whose
# Card is graded against the recipe's card ("keeps the recipe's card"), with
# the rest of the setup's grading.
#
# By hand only, one recipe a run, and only the desk's step: it spends money
# and depends on live services. Setup's definition is kiff/tafs' at
# eval/tafs.ref, as the Eval runs it; the recipe is read there too, or from a
# kiff/tafs branch or commit still in review (recipe_ref).
on:
  workflow_dispatch:
    inputs:
      recipe:
        description: "A recipe from kiff/tafs, by id (e.g. acknowledge-every-ticket)"
        type: string
        required: true
      recipe_ref:
        description: "The kiff/tafs branch or commit to read the recipe from, for one still in review; empty: eval/tafs.ref"
        type: string
        default: ""
permissions:
  contents: read
  id-token: write
  actions: read
# The same group as E2E and the Eval: they share the test's account and its
# setup agent, and a run starts by disconnecting the grants that agent asked for.
concurrency:
  group: test-account
  cancel-in-progress: false
jobs:
  recipe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      REPORTS: kiff-agents-eval-reports
      E2E_MADE: e2e-made.txt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: tafs' definitions, at eval/tafs.ref, and the recipe
        env:
          RECIPE: ${{ inputs.recipe }}
          RECIPE_REF: ${{ inputs.recipe_ref }}
        run: |
          if ! [[ "$RECIPE" =~ ^[a-z0-9-]{1,64}$ ]]; then
            echo "recipe: an id is lowercase letters, digits and dashes, at most 64" >&2
            exit 1
          fi
          git clone --quiet https://github.com/kiff/tafs tafs
          git -C tafs checkout --quiet "$(cat eval/tafs.ref)"
          infra/eval-definitions.sh tafs defs
          if [ -n "$RECIPE_REF" ]; then
            # A recipe still in review: read from its branch or commit; Setup stays at eval/tafs.ref.
            if ! [[ "$RECIPE_REF" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,99}$ ]] || [[ "$RECIPE_REF" == *..* ]]; then
              echo "recipe_ref: a branch or commit, letters, digits, '.', '_', '/' and '-'" >&2
              exit 1
            fi
            git -C tafs fetch --quiet --depth=1 origin "$RECIPE_REF"
            if ! git -C tafs show "FETCH_HEAD:recipes/$RECIPE.md" > recipe.md; then
              echo "recipe: no recipes/$RECIPE.md in kiff/tafs at $RECIPE_REF" >&2
              exit 1
            fi
          elif [ -f "tafs/recipes/$RECIPE.md" ]; then
            cp "tafs/recipes/$RECIPE.md" recipe.md
          else
            echo "recipe: no recipes/$RECIPE.md in kiff/tafs at eval/tafs.ref" >&2
            exit 1
          fi
      - name: The recipe, on the desk
        # This log is public: in CI the test writes only its steps and the
        # outcome, and masks every id it learns. The chat's transcript goes only
        # to the private bucket.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          E2E_KIFF_SESSION: ${{ secrets.E2E_KIFF_SESSION }}
          E2E_SETUP_KEY: ${{ secrets.E2E_SETUP_KEY }}
          E2E_PHONE_KEY: ${{ secrets.E2E_PHONE_KEY }}
          E2E_VENDOR: ${{ secrets.E2E_VENDOR }}
          E2E_VENDOR_TOKEN: ${{ secrets.E2E_VENDOR_TOKEN }}
          E2E_DESK_KEY: ${{ secrets.E2E_DESK_KEY }}
        run: go run ./cmd/e2e $([ -d defs/skills ] && echo -skills defs/skills) -setup defs/setup.json -desk -recipe recipe.md -grade -max-cost 4 -owner-turns 14 -transcript recipe.md.transcript
      - name: The sweep, the test account's leftover tafs
        # The teardown, after every run above whatever they did (sweep.go):
        # archive the tafs this job's runs made (E2E_MADE), so a run cut off
        # before its cleanup leaves none. Archiving takes a taf's keys with
        # it. It works as the owner's phone, with the calls KIFF takes from a
        # phone's session only, and never takes Setup's agent or any agent
        # this job didn't make. It prints only counts, and it never decides
        # the run: a failed sweep is reported, and the verdict is the steps
        # above.
        if: always()
        continue-on-error: true
        env:
          E2E_KIFF_SESSION: ${{ secrets.E2E_KIFF_SESSION }}
          E2E_PHONE_KEY: ${{ secrets.E2E_PHONE_KEY }}
        run: go run ./cmd/e2e -sweep
      # The role assumes only from main (infra/aws.sh).
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: always() && github.ref == 'refs/heads/main'
        with:
          role-to-assume: ${{ secrets.AWS_EVAL_ROLE }}
          aws-region: eu-west-1
      - name: The transcript, to the private bucket
        if: always() && github.ref == 'refs/heads/main'
        run: |
          key="reports/e2e-recipe-$(date -u +%Y-%m-%d)-${GITHUB_RUN_ID}"
          [ -f recipe.md.transcript ] && aws s3 cp --only-show-errors recipe.md.transcript "s3://$REPORTS/$key/recipe.md"
          echo "transcript: s3://$REPORTS/$key/"
