name: Proofs
# The integration proofs: each app that connects today is run as a user would,
# on the test account, and the run is posted to KIFF, which keeps each app's
# state. KIFF takes a run only from this workflow on main, by its GitHub OIDC
# token: its audience, this repository (name, id and owner id), the ref and
# this file's workflow_ref.
#
# The proofs (cmd/e2e -proof, proof.go) run once a day, every app, and by
# hand, one app or all, one at a time: the test account is the Eval's, so they share eval.yml's
# concurrency group and never run during an Eval. A proof uses no model; the
# weekly job (cmd/e2e -weekly) is the exception: it runs Coach, so it spends
# model money, capped per family. Its
# keys come only from the kiff-test environment (main only) and are masked;
# the log says each check and nothing of the account or the vendor. With dry,
# a proof asks, signs and posts nothing, and needs no key.
#
# A real proof's credentials, all in kiff-test: PROOF_TENANT (the Eval
# account; a proof anywhere else does nothing), PROOF_PHONE_KEY (the proof
# key, paired to that account as a phone) and PROOF_KIFF_SESSION (that
# phone's KIFF session, from the e2e sign-in for the Eval account, 90 days),
# E2E_SETUP_KEY, and each app's sandbox key. When the session ends or the key
# is unpaired, every proof ends as the runner's error, never counted against
# an app; KIFF alerts after three, and the session is signed in again.
#
# The claims job is the first setup's: it prints the claims KIFF pins and the
# test phone key's fingerprint, so KIFF can be set to take this workflow's
# runs. It reads no vendor and no account, sends nothing, and prints no
# token: only the claims, which name this repository and this run, and a
# fingerprint, which names a public key.
on:
  # Daily at 03:41 UTC: the proofs of every app (cmd/e2e -proof), no model, so
  # each app's state in KIFF stays fresh (a green counts for 24 hours). Off
  # the hour, and before the Monday Eval's 04:07, which shares the test
  # account. The weekly proof (two real Coach chats, model spend) runs by hand
  # only: the owner paused the provers on 21 Nov, and a run that spends on the
  # model goes only on their word.
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
    inputs:
      run:
        description: "What to run"
        type: choice
        options: [claims, proof, weekly, sheets]
        default: proof
      app:
        description: "The app to prove, or all"
        type: choice
        options: [all, moneybird, pipedrive, typeform]
        default: all
      dry:
        description: "Dry: ask, sign and post nothing"
        type: boolean
        default: true
      audience:
        description: "claims: the audience KIFF will take the runs' tokens for"
        type: string
        required: false
        default: "kiff-proofs"
permissions:
  contents: read
  id-token: write
jobs:
  apps:
    # A dispatch's proof, or the daily schedule's (every app, never dry).
    if: inputs.run == 'proof' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      apps: ${{ steps.apps.outputs.apps }}
    steps:
      - id: apps
        env:
          APP: ${{ inputs.app || 'all' }}
        run: |
          case "$APP" in
            all) echo 'apps=["moneybird","pipedrive","typeform"]' >> "$GITHUB_OUTPUT" ;;
            moneybird|pipedrive|typeform) echo "apps=[\"$APP\"]" >> "$GITHUB_OUTPUT" ;;
            *) echo "no such app"; exit 1 ;;
          esac
  dry:
    # What each proof would ask for, its Cards and its checks: no key, no
    # environment, nothing asked, signed or posted.
    needs: apps
    if: inputs.dry
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.apps.outputs.apps) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: The proof of ${{ matrix.app }}, dry
        env:
          APP: ${{ matrix.app }}
        run: go run ./cmd/e2e -proof "$APP" -proof-dry
  proof:
    needs: apps
    # Main only: kiff-test lets only main read its keys, and KIFF takes a run
    # only from this workflow on main.
    if: ${{ !inputs.dry && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    # A few minutes per app; this stops a stuck run well before the next
    # Eval would wait on it.
    timeout-minutes: 40
    environment: kiff-test
    # The Eval's: one run on the test account at a time. One job runs every
    # app in turn, so a proof never takes a waiting Eval's place in the group
    # (it holds one pending job).
    concurrency:
      group: test-account
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: The proofs, one app at a time
        env:
          APPS: ${{ join(fromJSON(needs.apps.outputs.apps), ' ') }}
          PROOF_TENANT: ${{ secrets.PROOF_TENANT }}
          PROOF_PHONE_KEY: ${{ secrets.PROOF_PHONE_KEY }}
          PROOF_KIFF_SESSION: ${{ secrets.PROOF_KIFF_SESSION }}
          E2E_SETUP_KEY: ${{ secrets.E2E_SETUP_KEY }}
          KEY_MONEYBIRD: ${{ secrets.PROOF_MONEYBIRD_KEY }}
          KEY_PIPEDRIVE: ${{ secrets.PROOF_PIPEDRIVE_KEY }}
          KEY_TYPEFORM: ${{ secrets.PROOF_TYPEFORM_KEY }}
        run: |
          go build -o "$RUNNER_TEMP/e2e" ./cmd/e2e
          failed=""
          for app in $APPS; do
            case "$app" in
              moneybird) key="$KEY_MONEYBIRD" ;;
              pipedrive) key="$KEY_PIPEDRIVE" ;;
              typeform) key="$KEY_TYPEFORM" ;;
              *) echo "no such app"; exit 1 ;;
            esac
            # Each proof gets its own app's key and no other.
            upper=$(printf '%s' "$app" | tr a-z A-Z)
            if ! env -u KEY_MONEYBIRD -u KEY_PIPEDRIVE -u KEY_TYPEFORM "PROOF_${upper}_KEY=$key" "$RUNNER_TEMP/e2e" -proof "$app"; then
              failed="$failed $app"
            fi
          done
          if [ -n "$failed" ]; then
            echo "failed:$failed"
            exit 1
          fi
  weekly:
    # A real Coach chat per family on tafs cloud, its approval through the
    # component route alone (cmd/e2e -weekly, weekly_main.go). Main only, in
    # kiff-test, in the Eval's group: one run on the test account at a time.
    # By hand only: never on the daily schedule, which is model-free.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run == 'weekly' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: kiff-test
    # actions: read, for the last weekly run's steps. No OIDC: weekly results
    # go to the job's summary, never to KIFF.
    permissions:
      contents: read
      actions: read
    concurrency:
      group: test-account
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: The families the last weekly run skipped
        # A family skipped for a secret of its own not set is "skipped, not
        # proved"; skipped twice in a row, it fails the job.
        # A skip shows as the step "Skipped, not proved: <family>" that ran;
        # this reads those steps from the last run whose weekly job ran.
        id: last
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          skipped=""
          for id in $(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/proofs.yml/runs?branch=main&status=completed&per_page=50" \
            --jq ".workflow_runs[] | select(.id != ${GITHUB_RUN_ID}) | .id"); do
            ran=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/jobs" \
              --jq '[.jobs[] | select(.name == "weekly" and .conclusion != "skipped")][0] | if . == null then "no" else "ran " + ([.steps[] | select(.conclusion == "success") | .name | select(startswith("Skipped, not proved: ")) | ltrimstr("Skipped, not proved: ")] | join(" ")) end')
            if [ "$ran" != no ]; then skipped=${ran#ran}; break; fi
          done
          echo "the last weekly run skipped:${skipped:- nothing}"
          echo "skipped=${skipped# }" >> "$GITHUB_OUTPUT"
      - name: The weekly proof, key family
        id: key
        env:
          PROOF_TENANT: ${{ secrets.PROOF_TENANT }}
          PROOF_PHONE_KEY: ${{ secrets.PROOF_PHONE_KEY }}
          PROOF_KIFF_SESSION: ${{ secrets.PROOF_KIFF_SESSION }}
          E2E_SETUP_KEY: ${{ secrets.E2E_SETUP_KEY }}
          PROOF_PIPEDRIVE_KEY: ${{ secrets.PROOF_PIPEDRIVE_KEY }}
          WEEKLY_LAST_SKIPPED: ${{ steps.last.outputs.skipped }}
        run: go run ./cmd/e2e -weekly key
      - name: "Skipped, not proved: key"
        if: ${{ !cancelled() && steps.key.outputs.skipped == 'true' }}
        run: echo "the key family was skipped, not proved; see the summary"
      - name: The weekly proof, own-key family (the fake vendor's desk by its key, a raw request)
        id: own-key
        # Runs even when the key family failed: each family is its own proof.
        if: ${{ !cancelled() }}
        env:
          PROOF_TENANT: ${{ secrets.PROOF_TENANT }}
          PROOF_PHONE_KEY: ${{ secrets.PROOF_PHONE_KEY }}
          PROOF_KIFF_SESSION: ${{ secrets.PROOF_KIFF_SESSION }}
          E2E_SETUP_KEY: ${{ secrets.E2E_SETUP_KEY }}
          E2E_DESK_KEY: ${{ secrets.E2E_DESK_KEY }}
          E2E_VENDOR: ${{ secrets.E2E_VENDOR }}
          WEEKLY_LAST_SKIPPED: ${{ steps.last.outputs.skipped }}
        run: go run ./cmd/e2e -weekly own-key
      - name: "Skipped, not proved: own-key"
        if: ${{ !cancelled() && steps.own-key.outputs.skipped == 'true' }}
        run: echo "the own-key family was skipped, not proved; see the summary"
  sheets:
    # The Sheets dry run, by hand only (cmd/e2e -weekly-sheets,
    # weekly_sheets.go): a real Coach chat on tafs cloud up to its approval
    # card, never approved, then a second new chat. Main only, in kiff-test,
    # in the test account's group, capped at US$3. Never on the schedule.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run == 'sheets' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: kiff-test
    permissions:
      contents: read
    concurrency:
      group: test-account
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: The Sheets dry run
        env:
          PROOF_TENANT: ${{ secrets.PROOF_TENANT }}
          PROOF_PHONE_KEY: ${{ secrets.PROOF_PHONE_KEY }}
          PROOF_KIFF_SESSION: ${{ secrets.PROOF_KIFF_SESSION }}
          E2E_SETUP_KEY: ${{ secrets.E2E_SETUP_KEY }}
        run: go run ./cmd/e2e -weekly-sheets
  claims:
    if: inputs.run == 'claims'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: The claims KIFF pins, from this run's own token
        env:
          AUDIENCE: ${{ inputs.audience }}
        run: |
          case "$AUDIENCE" in *[!A-Za-z0-9._:/-]*|"") echo "the audience is letters, digits and . _ : / -"; exit 1 ;; esac
          token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" | jq -r .value)
          echo "::add-mask::$token"
          # The payload alone, as JSON; the token itself never reaches the log.
          payload=$(printf '%s' "$token" | cut -d. -f2 | tr '_-' '/+')
          while [ $(( ${#payload} % 4 )) -ne 0 ]; do payload="$payload="; done
          printf '%s' "$payload" | base64 -d | jq '{aud, iss, repository, repository_id, repository_owner, repository_owner_id, ref, workflow_ref, sub, event_name}'
      - name: The test phone key's fingerprint, as KIFF shows it
        env:
          E2E_PHONE_KEY: ${{ secrets.E2E_PHONE_KEY }}
        run: |
          # The first 16 hex characters of the SHA-256 of its DER public key.
          if [ -z "$E2E_PHONE_KEY" ]; then echo "E2E_PHONE_KEY isn't set here"; exit 1; fi
          printf '%s' "$E2E_PHONE_KEY" | base64 -d | openssl pkey -inform DER -pubout -outform DER | sha256sum | cut -c1-16
