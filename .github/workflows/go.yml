name: Go
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No private references
        # A private tracker is never named in this public repo: not in the tree, not in a pull
        # request's added lines. The pattern is split so this file never matches it.
        run: |
          pattern='kiff-cloud''#|kiff/kiff''-cloud|[Tt]he ''PM\b'
          if git grep -nE "$pattern" -- .; then
            echo "::error::a private reference is in the tree: name the gap or describe it instead"; exit 1
          fi
          if [ -n "$BASE" ]; then
            git fetch --no-tags --depth=1 origin "$BASE"
            if git diff "origin/$BASE" HEAD | grep -E '^\+' | grep -E "$pattern"; then
              echo "::error::a private reference is in this pull request's diff"; exit 1
            fi
          fi
        env:
          BASE: ${{ github.base_ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...
      - name: Benchmarks still run
        run: go test -run '^$' -bench . -benchtime 1000x ./...
  bench:
    # A pull request's benchmarks against its base branch's, in turns on one
    # runner: fails on a clear slowdown (see .github/bench.sh).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install benchstat
        run: |
          go install golang.org/x/perf/cmd/benchstat@v0.0.0-20260813145340-fd4a688df892
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Compare with the base branch
        run: .github/bench.sh "origin/$GITHUB_BASE_REF"
  dynamodb:
    # The DynamoDB store against DynamoDB Local: tests never touch AWS, and
    # each one deletes the table it made.
    runs-on: ubuntu-latest
    services:
      dynamodb:
        image: amazon/dynamodb-local:3.3.1
        ports:
          - 8000:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: DynamoDB store tests
        env:
          DYNAMODB_ENDPOINT: http://localhost:8000
        run: go test -race -count=1 -v ./store/dynamodb/ 2>&1 | grep -E -- "^ *(--- |PASS|FAIL|ok|panic)|_test.go" | grep -v "=== RUN"; exit ${PIPESTATUS[0]}
