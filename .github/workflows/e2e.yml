name: E2E
# The simulated-owner end-to-end test of the tafs setup chat (#91): a
# scripted owner asks the setup agent to connect a vendor's refunds, answers
# what it shows, and ends with a Refunds taf whose refund inside its Card
# reaches the vendor and whose refund outside it doesn't. The agents run on
# this commit's runtime, in the job; the model, KIFF (a test account),
# planque and the fake vendor are real services.
#
# The setup agent and the taf are kiff/tafs' own, at eval/tafs.ref, as the
# Eval runs them: what ships, not a copy kept here (kiff/agents#78).
#
# Every night and by hand. It doesn't gate pull requests: it spends money
# and depends on live services.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      improve:
        description: Also the improve case (kiff/tafs#107, #173) - a new version, tried beside the live one under its own Card, then installed
        type: boolean
        default: false
      people:
        description: Also step 9 (kiff/tafs#294) - a taf shared with Support, used by Maria and Luis, each seeing only their own use of it
        type: boolean
        default: true
permissions:
  contents: read
  id-token: write
  actions: read
# One group with the Eval: both run on the test's account with the same setup agent,
# and a run starts by disconnecting the grants that agent asked for, so two at
# once take each other's tools away. They queue instead.
concurrency:
  group: test-account
  cancel-in-progress: false
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      REPORTS: kiff-agents-eval-reports
      # Each taf a run makes, for the sweep at the end (cmd/e2e -made).
      E2E_MADE: e2e-made.txt
      # Whether step 9's people are signed in: a step's if can't read secrets.
      HAS_PEOPLE: ${{ secrets.E2E_MARIA_SESSION != '' && secrets.E2E_LUIS_SESSION != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Unchanged since the last pass?
        # A scheduled night measures nothing new when the latest completed
        # run of this workflow on main passed and nothing but docs changed
        # since its commit (eval/tafs.ref included): it says so and spends
        # nothing. Its success carries that pass, with the same
        # eval/tafs.ref, so kiff/tafs' Upgrade gate accepts it. A latest run
        # that failed, or was cancelled, is never skipped over: the night
        # runs, so a red stays red. A dispatch always runs.
        id: unchanged
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/e2e.yml/runs?branch=main&status=completed&per_page=5" \
            --jq "[.workflow_runs[] | select(.id != ${GITHUB_RUN_ID})][0] | \"\\(.id) \\(.conclusion) \\(.head_sha)\"")
          read -r id conclusion sha <<<"$last"
          if [ "$conclusion" != success ] || [ -z "$sha" ] || ! git cat-file -e "$sha" 2>/dev/null; then
            exit 0
          fi
          changed=$(git diff --name-only "$sha" HEAD | grep -v -E '^docs/|\.md$' || true)
          if [ -z "$changed" ]; then
            echo "skipped: unchanged since run $id (${sha:0:12})"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        if: steps.unchanged.outputs.skip != 'true'
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.unchanged.outputs.skip != 'true'
        with:
          node-version: 22
      - name: tafs' definitions, at eval/tafs.ref
        if: steps.unchanged.outputs.skip != 'true'
        run: |
          git clone --quiet https://github.com/kiff/tafs tafs
          git -C tafs checkout --quiet "$(cat eval/tafs.ref)"
          infra/eval-definitions.sh tafs defs
      - name: The simulated owner
        if: steps.unchanged.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          E2E_KIFF_SESSION: ${{ secrets.E2E_KIFF_SESSION }}
          E2E_SETUP_KEY: ${{ secrets.E2E_SETUP_KEY }}
          E2E_PHONE_KEY: ${{ secrets.E2E_PHONE_KEY }}
          E2E_VENDOR: ${{ secrets.E2E_VENDOR }}
          E2E_VENDOR_TOKEN: ${{ secrets.E2E_VENDOR_TOKEN }}
          IMPROVE: ${{ inputs.improve && '-improve' || '' }}
        # This log is public: in CI the test writes only its steps and the
        # outcome, and masks every id it learns (cmd/e2e, redacting). The
        # chat's transcript (setup.md) goes only to the private bucket, so a
        # failed chat can be read afterwards.
        run: go run ./cmd/e2e $([ -d defs/skills ] && echo -skills defs/skills) -setup defs/setup.json -taf defs/refunds.json -max-cost 4 -owner-turns 14 -transcript setup.md $IMPROVE
      - name: The second vendor, a desk by its key
        # kiff/agents#293: Setup connects the fake vendor's support desk by its
        # REST API and a key the phone gives, and the grant is checked.
        if: steps.unchanged.outputs.skip != 'true' && (always())
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          E2E_KIFF_SESSION: ${{ secrets.E2E_KIFF_SESSION }}
          E2E_SETUP_KEY: ${{ secrets.E2E_SETUP_KEY }}
          E2E_PHONE_KEY: ${{ secrets.E2E_PHONE_KEY }}
          E2E_VENDOR: ${{ secrets.E2E_VENDOR }}
          E2E_VENDOR_TOKEN: ${{ secrets.E2E_VENDOR_TOKEN }}
          E2E_DESK_KEY: ${{ secrets.E2E_DESK_KEY }}
        run: go run ./cmd/e2e $([ -d defs/skills ] && echo -skills defs/skills) -setup defs/setup.json -desk -max-cost 3 -owner-turns 14 -transcript desk.md
      - name: Setup in Spanish, graded, as advice
        # The Eval's graded setup chat (eval.yml), with an owner who writes in
        # Spanish and the taf as kiff/tafs defines it, nightly only, without
        # the improve case. It never fails the night: the Eval's English chat
        # gates, and what this one finds is advice, read in its transcript
        # (setup-es.md, the private bucket). The judge is Sonnet, as there.
        if: steps.unchanged.outputs.skip != 'true' && github.event_name == 'schedule' && (always())
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          E2E_KIFF_SESSION: ${{ secrets.E2E_KIFF_SESSION }}
          E2E_SETUP_KEY: ${{ secrets.E2E_SETUP_KEY }}
          E2E_PHONE_KEY: ${{ secrets.E2E_PHONE_KEY }}
          E2E_VENDOR: ${{ secrets.E2E_VENDOR }}
          E2E_VENDOR_TOKEN: ${{ secrets.E2E_VENDOR_TOKEN }}
        run: go run ./cmd/e2e $([ -d defs/skills ] && echo -skills defs/skills) -setup defs/setup.json -taf defs/refunds.json -owner es -grade -max-cost 4 -owner-turns 14 -transcript setup-es.md -judge-model claude-sonnet-5-5 -judge-price 2000000,10000000
      # Step 9's people, on a taf of the run's own on tafs cloud, shared with
      # Support (cmd/e2e/people.go). Nightly, and by hand unless turned off;
      # skipped while the people's sessions aren't set (infra/e2e-people-signin.sh).
      - name: Step 9's people
        if: steps.unchanged.outputs.skip != 'true' && (always() && (github.event_name == 'schedule' || inputs.people) && env.HAS_PEOPLE == 'true')
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          E2E_KIFF_SESSION: ${{ secrets.E2E_KIFF_SESSION }}
          E2E_SETUP_KEY: ${{ secrets.E2E_SETUP_KEY }}
          E2E_PHONE_KEY: ${{ secrets.E2E_PHONE_KEY }}
          E2E_VENDOR: ${{ secrets.E2E_VENDOR }}
          E2E_VENDOR_TOKEN: ${{ secrets.E2E_VENDOR_TOKEN }}
          E2E_MARIA_SESSION: ${{ secrets.E2E_MARIA_SESSION }}
          E2E_MARIA_PHONE_KEY: ${{ secrets.E2E_MARIA_PHONE_KEY }}
          E2E_LUIS_SESSION: ${{ secrets.E2E_LUIS_SESSION }}
          E2E_LUIS_PHONE_KEY: ${{ secrets.E2E_LUIS_PHONE_KEY }}
        run: go run ./cmd/e2e $([ -d defs/skills ] && echo -skills defs/skills) -setup defs/setup.json -taf defs/refunds.json -max-cost 4 -owner-turns 14 -transcript people.md -people
      - name: The sweep, the test account's leftover tafs
        # The teardown, after every run above whatever they did (sweep.go):
        # archive the tafs this job's runs made (E2E_MADE), so a run cut off
        # before its cleanup leaves none. Archiving takes a taf's keys with
        # it. It works as the owner's phone, with the calls KIFF takes from a
        # phone's session only, and never takes Setup's agent or any agent
        # this job didn't make. It prints only counts, and it never decides
        # the run: a failed sweep is reported, and the verdict is the steps
        # above.
        if: steps.unchanged.outputs.skip != 'true' && (always())
        continue-on-error: true
        env:
          E2E_KIFF_SESSION: ${{ secrets.E2E_KIFF_SESSION }}
          E2E_PHONE_KEY: ${{ secrets.E2E_PHONE_KEY }}
        run: go run ./cmd/e2e -sweep
      # The role assumes only from main (infra/aws.sh).
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: steps.unchanged.outputs.skip != 'true' && (always() && github.ref == 'refs/heads/main')
        with:
          role-to-assume: ${{ secrets.AWS_EVAL_ROLE }}
          aws-region: eu-west-1
      - name: The transcript, to the private bucket
        if: steps.unchanged.outputs.skip != 'true' && (always() && github.ref == 'refs/heads/main')
        run: |
          key="reports/e2e-$(date -u +%Y-%m-%d)-${GITHUB_RUN_ID}"
          [ -f setup.md ] && aws s3 cp --only-show-errors setup.md "s3://$REPORTS/$key/setup.md"
          [ -f people.md ] && aws s3 cp --only-show-errors people.md "s3://$REPORTS/$key/people.md"
          [ -f desk.md ] && aws s3 cp --only-show-errors desk.md "s3://$REPORTS/$key/desk.md"
          [ -f setup-es.md ] && aws s3 cp --only-show-errors setup-es.md "s3://$REPORTS/$key/setup-es.md"
          echo "transcript: s3://$REPORTS/$key/"

